<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>建立您的專屬網址</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#eef2f5; --text:#101416; --muted:#5f676c; --line:#aeb8bd;
      --cyan:#48dfe7; --danger:#b93d3d; --card:rgba(255,255,255,.72);
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
    body::before{content:"";position:fixed;width:760px;height:760px;left:50%;top:46%;transform:translate(-50%,-50%);border-radius:50%;
      background:radial-gradient(circle,rgba(238,242,245,.92) 0 18%,rgba(72,223,231,.20) 19% 24%,rgba(238,242,245,.92) 25% 35%,rgba(72,223,231,.24) 36% 43%,rgba(238,242,245,.92) 44% 56%,rgba(72,223,231,.30) 57% 66%,rgba(72,223,231,.14) 67% 74%,rgba(238,242,245,0) 75%);filter:blur(10px);pointer-events:none;z-index:0}
    .shell{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:64px 34px 72px;display:grid;grid-template-columns:minmax(280px,.85fr) minmax(360px,1.15fr);gap:60px;align-items:center;min-height:100vh}
    .hero h1{margin:0;font-size:clamp(48px,6vw,88px);line-height:.96;letter-spacing:-.05em;font-weight:400}
    .hero p{margin:24px 0 0;max-width:420px;font-size:15px;line-height:1.8;color:var(--muted)}
    .form-panel{position:relative;padding:10px 0 4px}
    .eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:36px;font-size:13px;letter-spacing:.18em;text-transform:uppercase}
    .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:#111}
    .group{margin-bottom:26px} .labelrow{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:8px}
    label{display:block;font-size:24px;line-height:1.1;letter-spacing:.02em;font-weight:400} .small{font-size:12px;color:var(--muted);letter-spacing:.04em}
    input{width:100%;border:0;border-bottom:1px solid rgba(16,20,22,.62);background:transparent;color:var(--text);padding:12px 2px 11px;font-size:17px;outline:none;border-radius:0}
    input::placeholder{color:#8b9499} input:focus{border-bottom-color:#111}
    .hint{margin-top:7px;color:var(--muted);font-size:12px;line-height:1.6} .msg{min-height:22px;margin-top:8px;font-size:13px} .err{color:var(--danger)} .ok{color:#157f79}
    button{margin-top:12px;min-width:210px;border:1px solid #111;background:#111;color:#fff;padding:14px 22px;border-radius:999px;font-size:15px;letter-spacing:.04em;cursor:pointer;transition:.2s ease}
    button:hover{background:transparent;color:#111} .secondary{background:transparent;color:#111} .secondary:hover{background:#111;color:#fff}
    .success{display:none;padding-top:6px} .success h2{font-size:44px;font-weight:400;margin:0 0 10px;letter-spacing:-.03em} .success p{color:var(--muted);line-height:1.8;margin:0 0 18px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:32px}
    .wall-preview{border-top:1px solid rgba(16,20,22,.45);padding-top:22px;margin-top:12px}
    .wall-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:16px} .wall-head h3{margin:0;font-size:24px;font-weight:400} .wall-head span{font-size:12px;color:var(--muted);letter-spacing:.08em}
    .preview-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .preview-card{position:relative;background:var(--card);border-top:1px solid rgba(16,20,22,.6);padding:14px 12px 13px;min-height:112px;backdrop-filter:blur(6px)}
    .preview-card::before{content:"";position:absolute;left:-3px;top:-4px;width:6px;height:6px;border-radius:50%;background:#111}
    .preview-company{font-size:17px;line-height:1.25} .preview-desc{margin-top:5px;font-size:12px;line-height:1.45;color:var(--muted)} .preview-domain{margin-top:12px;font-size:13px;font-weight:700;overflow-wrap:anywhere}
    .empty{grid-column:1/-1;padding:18px 0;color:var(--muted);font-size:13px} .meta{position:absolute;right:0;bottom:-26px;font-size:11px;color:#7c858a;letter-spacing:.12em;text-transform:uppercase}
    @media(max-width:820px){body::before{width:620px;height:620px;top:28%} .shell{min-height:auto;grid-template-columns:1fr;gap:46px;padding:48px 24px 64px} .hero h1{font-size:56px} .hero p{max-width:520px} label{font-size:21px} .meta{position:static;margin-top:26px}}
    @media(max-width:520px){.preview-grid{grid-template-columns:1fr} button{width:100%;min-width:0}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <h1>Build<br>your<br>domain.</h1>
      <p>輸入公司名稱、簡介與希望建立的專屬網址。送出後，您可以立即看到目前大家的提案，也能繼續新增下一筆。</p>
    </section>
    <section class="form-panel">
      <div id="formView">
        <div class="eyebrow">Domain proposal</div>
        <form id="form" novalidate>
          <div class="group"><div class="labelrow"><label for="company">公司名稱</label><span class="small">COMPANY</span></div><input id="company" maxlength="60" placeholder="例如：獨庫數位行銷" /></div>
          <div class="group"><div class="labelrow"><label for="desc">公司簡介</label><span class="small" id="count">0 / 40</span></div><input id="desc" maxlength="40" placeholder="例如：網站設計與數位行銷" /></div>
          <div class="group"><div class="labelrow"><label for="domain">專屬網址</label><span class="small">DOMAIN</span></div><input id="domain" inputmode="url" autocapitalize="none" placeholder="例如：dokudigital.tw" /><div class="hint">請輸入 .tw 或 .com.tw，不需加入 https://</div></div>
          <div id="msg" class="msg" aria-live="polite"></div>
          <button type="submit">SUBMIT DOMAIN</button>
        </form>
      </div>
      <div id="success" class="success">
        <h2>Submitted.</h2>
        <p>您的網址提案已送出，下方會顯示目前大家已填寫的資訊。</p>
        <div class="actions"><button id="again" type="button">再新增一筆</button><button id="scrollWall" type="button" class="secondary">查看大家的提案</button></div>
        <section class="wall-preview" id="wallPreview">
          <div class="wall-head"><h3>大家的專屬網址</h3><span>共 <b id="total">0</b> 筆</span></div>
          <div id="previewGrid" class="preview-grid"></div>
        </section>
      </div>
      <div class="meta">Interactive domain wall / 2026</div>
    </section>
  </main>

<script>
(() => {
  const PROJECT_URL = "https://bhlibnjbaekpbnarbedg.supabase.co";
  const PUBLISHABLE_KEY = "sb_publishable_U72v9QE1pthEDhoHl080nQ_jpOGKdTi";
  const client = window.supabase.createClient(PROJECT_URL, PUBLISHABLE_KEY);

  const form = document.getElementById("form"), company = document.getElementById("company"),
        desc = document.getElementById("desc"), domain = document.getElementById("domain"),
        count = document.getElementById("count"), msg = document.getElementById("msg"),
        formView = document.getElementById("formView"), success = document.getElementById("success"),
        again = document.getElementById("again"), scrollWall = document.getElementById("scrollWall"),
        previewGrid = document.getElementById("previewGrid"), total = document.getElementById("total"),
        wallPreview = document.getElementById("wallPreview");

  function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  function normalizeDomain(v){return v.trim().toLowerCase().replace(/^https?:\/\//,"").replace(/^www\./,"").replace(/\/.*$/,"").replace(/\.$/,"")}
  function validDomain(v){return /^(?=.(3, 253)$)([a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+(tw|com\.tw)$/.test(v)}

  async function renderPreview(){
    const { data, error } = await client.from("domain_submissions").select("*").order("created_at", { ascending:false });
    if(error){previewGrid.innerHTML='<div class="empty">尚未連上資料庫，請先完成 Supabase SQL 設定。</div>'; return}
    total.textContent = data.length;
    previewGrid.innerHTML = data.length ? data.map(x=>`
      <article class="preview-card">
        <div class="preview-company">${esc(x.company)}</div>
        <div class="preview-desc">${esc(x.description)}</div>
        <div class="preview-domain">${esc(x.domain)}</div>
      </article>`).join("") : '<div class="empty">目前還沒有任何提案。</div>';
  }

  desc.addEventListener("input",()=>count.textContent=`${desc.value.length} / 40`);

  form.addEventListener("submit", async e=>{
    e.preventDefault(); msg.textContent=""; msg.className="msg";
    const c=company.value.trim(), d=desc.value.trim(), dm=normalizeDomain(domain.value);
    if(!c||!d||!dm){msg.textContent="請完整填寫三個欄位。";msg.classList.add("err");return}
    if(!validDomain(dm)){msg.textContent="網址格式需為 xxx.tw 或 xxx.com.tw。";msg.classList.add("err");return}
    const { error } = await client.from("domain_submissions").insert({company:c,description:d,domain:dm});
    if(error){
      msg.textContent = error.code === "23505" ? "這個網址已有人提交，請換一個網址。" : "送出失敗：" + error.message;
      msg.classList.add("err"); return;
    }
    form.reset(); count.textContent="0 / 40"; await renderPreview();
    formView.style.display="none"; success.style.display="block"; window.scrollTo({top:0,behavior:"smooth"});
  });

  again.addEventListener("click",()=>{success.style.display="none";formView.style.display="block";msg.textContent="";company.focus()});
  scrollWall.addEventListener("click",()=>wallPreview.scrollIntoView({behavior:"smooth",block:"start"}));

  client.channel("domain-wall-preview")
    .on("postgres_changes", {event:"*",schema:"public",table:"domain_submissions"}, renderPreview)
    .subscribe();

  renderPreview();
})();
</script>
</body>
</html>
